<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PW3Mate - Powerwall Schedule Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen" class="screen">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">&#9889;</div>
                <h1>PW3Mate</h1>
                <p class="logo-subtitle">Powerwall Schedule Manager</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Sign In</button>
                <div id="login-error" class="error-message hidden"></div>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="screen hidden">
        <header class="app-header">
            <div class="header-content">
                <div class="header-left">
                    <span class="header-icon">&#9889;</span>
                    <h1>PW3Mate</h1>
                </div>
                <button id="logout-btn" class="btn btn-outline-light">Sign Out</button>
            </div>
        </header>

        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h2>Powerwall Schedules</h2>
                    <p class="subtitle" id="timezone-label"></p>
                </div>
                <button id="add-schedule-btn" class="btn btn-primary">+ Add Schedule</button>
            </div>

            <div id="schedules-list" class="schedules-grid"></div>

            <div id="empty-state" class="empty-state hidden">
                <div class="empty-icon">&#128203;</div>
                <h3>No Schedules Yet</h3>
                <p>Add your first schedule to start automating your Powerwall.</p>
            </div>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Loading schedules...</p>
            </div>
        </main>
    </div>

    <!-- Add / Edit Modal -->
    <div id="schedule-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Schedule</h2>
                <button class="modal-close" aria-label="Close">&times;</button>
            </div>
            <form id="schedule-form">
                <div class="form-group">
                    <label>Time (UTC)</label>
                    <div class="time-picker">
                        <select id="schedule-hour" aria-label="Hour"></select>
                        <span class="time-separator">:</span>
                        <select id="schedule-minute" aria-label="Minute"></select>
                        <span class="time-badge">UTC</span>
                    </div>
                    <div id="local-time-preview" class="time-preview"></div>
                </div>

                <div class="form-group">
                    <label>Backup Reserve: <strong id="percentage-display">50</strong>%</label>
                    <input type="range" id="schedule-percentage" min="0" max="100" value="50" step="5">
                    <div class="range-labels">
                        <span>0%</span>
                        <span>50%</span>
                        <span>100%</span>
                    </div>
                </div>

                <input type="hidden" id="editing-rule-name" value="">

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" id="modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="modal-save">Save Schedule</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Delete Schedule</h2>
                <button class="modal-close" aria-label="Close">&times;</button>
            </div>
            <p id="delete-message">Are you sure you want to delete this schedule?</p>
            <div class="modal-actions">
                <button class="btn btn-outline" id="delete-cancel">Cancel</button>
                <button class="btn btn-danger" id="delete-confirm">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
